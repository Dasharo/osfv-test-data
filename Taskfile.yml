version: '3'

env:
  IMAGE: git.3mdeb.com/dasharo/osfv-test-data-ci

vars:
  RELEASE_TAG:
    sh: echo "$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"

tasks:
  image:build:
    desc: Build the CI image from .ci/Dockerfile, tagged latest and with a UTC timestamp and the commit
    cmds:
      - docker build -t "$IMAGE:latest" -t "$IMAGE:{{.RELEASE_TAG}}" .ci

  image:release:
    desc: Build and push the CI image
    cmds:
      - task: image:build
      - docker push "$IMAGE:latest"
      - docker push "$IMAGE:{{.RELEASE_TAG}}"

  # Run CMD directly in the CI image, as in CI, otherwise start the image,
  # giving the files back to their owner afterwards. The git dir is mounted at
  # its own path, a submodule's .git points outside the tree
  run:
    internal: true
    cmds:
      - |
        {{if .OSFV_TEST_DATA_IMAGE}}
        {{.CMD}}
        {{else}}
        gitdir=$(git rev-parse --absolute-git-dir)
        tty=""
        if [ -t 1 ]; then tty=-t; fi
        docker run --rm --network host $tty \
          -v "{{.ROOT_DIR}}:{{.ROOT_DIR}}" -v "$gitdir:$gitdir" -w "{{.ROOT_DIR}}" \
          -e FTP_DOMAIN -e FTP_LOGIN -e FTP_PASSWORD -e FTP_REMOTE_DIR_PREFIX -e PUBLIC_URL \
          -e GIT_AUTHOR_NAME="$(git config user.name)" -e GIT_AUTHOR_EMAIL="$(git config user.email)" \
          -e GIT_COMMITTER_NAME="$(git config user.name)" -e GIT_COMMITTER_EMAIL="$(git config user.email)" \
          "$IMAGE:latest" sh -c '{{.CMD}}; rc=$?; chown -R "$(stat -c %u:%g .)" . "$1"; exit $rc' sh "$gitdir"
        {{end}}

  setup:
    desc: Initialize the annex and fetch every annexed file from the FTP
    cmds:
      - ./setup.sh

  mirror:
    desc: Upload annexed files missing from the FTP, register the FTP URL and drop every other URL, without pushing
    cmds:
      - task: run
        vars:
          CMD: ./artifacts.sh mirror

  publish:
    desc: Mirror every annexed file to the FTP and push master
    cmds:
      - task: setup
      # The FTP copy must exist before master points at a file
      - task: mirror
      - git push origin master git-annex
