version: '3'

env:
  IMAGE: git.3mdeb.com/dasharo/osfv-test-data-ci

vars:
  RELEASE_TAG:
    sh: echo "$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"

tasks:
  image:build:
    desc: Build the CI image from .ci/Dockerfile, tagged latest and with a UTC timestamp and the commit
    cmds:
      - docker build -t "$IMAGE:latest" -t "$IMAGE:{{.RELEASE_TAG}}" .ci

  image:release:
    desc: Build and push the CI image
    cmds:
      - task: image:build
      - docker push "$IMAGE:latest"
      - docker push "$IMAGE:{{.RELEASE_TAG}}"

  # Run CMD directly in the CI image, as in CI, otherwise start the image: as
  # root, giving the files back to their owner afterwards. The git
  # dir is mounted at its own path, a submodule's .git points outside the tree
  run:
    internal: true
    cmds:
      - |
        {{if .OSFV_TEST_DATA_IMAGE}}
        {{.CMD}}
        {{else}}
        gitdir=$(git rev-parse --absolute-git-dir)
        tty=""
        if [ -t 1 ]; then tty=-t; fi
        docker run --rm --network host $tty \
          -v "{{.ROOT_DIR}}:{{.ROOT_DIR}}" -v "$gitdir:$gitdir" -w "{{.ROOT_DIR}}" \
          -e FTP_DOMAIN -e FTP_LOGIN -e FTP_PASSWORD -e FTP_REMOTE_DIR_PREFIX -e PUBLIC_URL \
          -e GIT_AUTHOR_NAME="$(git config user.name)" -e GIT_AUTHOR_EMAIL="$(git config user.email)" \
          -e GIT_COMMITTER_NAME="$(git config user.name)" -e GIT_COMMITTER_EMAIL="$(git config user.email)" \
          "$IMAGE:latest" sh -c '{{.CMD}}; rc=$?; chown -R "$(stat -c %u:%g .)" . "$1"; exit $rc' sh "$gitdir"
        {{end}}

  setup:
    desc: Initialize the annex and fetch every annexed file from the FTP
    cmds:
      - ./setup.sh

  build:
    desc: Build, download or keep the ARTIFACTS of DIR (default every */Makefile) and add them to the annex
    cmds:
      - task: setup
      - task: run
        vars:
          CMD: ./artifacts.sh build {{if .DIR}}{{.DIR}}{{else}}$(dirname */Makefile){{end}}

  check:
    desc: Fail when the annexed files differ from the ARTIFACTS, or a clone is recorded in the git-annex branch
    cmds:
      - task: run
        vars:
          CMD: ./artifacts.sh check

  forget:
    desc: Prune every clone recorded in the git-annex branch and force push it
    prompt: This rewrites and force pushes the git-annex branch. Continue?
    cmds:
      - task: run
        vars:
          CMD: ./artifacts.sh forget
      - git push --force origin git-annex

  mirror:
    desc: Upload annexed files missing from the FTP, register the FTP URL and drop every other URL, without pushing
    cmds:
      - task: run
        vars:
          CMD: ./artifacts.sh mirror

  publish:
    desc: Build the ARTIFACTS of DIR, commit them, mirror everything to the FTP and push master
    preconditions:
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = master ]'
        msg: Run from the master branch
    cmds:
      # Publish commits only artifacts, built from committed sources
      - task: run
        vars:
          CMD: ./artifacts.sh clean
      - task: run
        vars:
          CMD: ./artifacts.sh build {{.DIR}}
      - task: check
      - git diff --cached --quiet || git commit -m "Update artifacts"
      # The FTP copy must exist before master points at a file
      - task: mirror
      - git push origin master git-annex

  ci:
    desc: CI entry point, publish the directories changed by the pushed commits
    vars:
      CHANGED:
        sh: ./artifacts.sh changed
    cmds:
      - task: publish
        vars:
          DIR: '{{.CHANGED}}'
